<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flug oder Bahn ab Stuttgart</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* CreatorLab-Design: Schwarz-Weiß, schmale Versal-Headlines,
   Mono-Etiketten, Eckwinkel, 2-px-Linien. Layout: links Stellschrauben, rechts Wirkung. */
:root{
  --paper:#ffffff; --ink:#0a0a0a; --mute:#5c5c5c; --faint:#9a9a9a; --soft:#ededed; --rule:#0a0a0a;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
.wrap{max-width:1400px;margin:0 auto;display:grid;gap:22px}
.mono,.tag{font-family:var(--mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 32px;padding-block:26px 18px;border-bottom:2px solid var(--rule)}
.brand{display:flex;align-items:flex-end;gap:22px;min-width:0;flex-wrap:wrap}
.brand img{height:54px;width:auto;flex:none}
.brand .eyebrow{color:var(--mute);margin-bottom:6px}
h1{font:800 clamp(32px,5.4vw,60px)/.92 var(--display);text-transform:uppercase;letter-spacing:.01em;margin:0;text-wrap:balance}
.lang{display:flex;border:2px solid var(--ink)}
.lang button{font:500 12px var(--mono);letter-spacing:.08em;padding:7px 12px;background:var(--paper);color:var(--ink);border:0;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.lead{margin:0;max-width:78ch;color:var(--mute);font-size:16px}
.banner{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:10px 0;font-size:14px}
.banner .mono{background:var(--ink);color:var(--paper);padding:2px 8px}
.banner.demo .mono{background:var(--paper);color:var(--ink);outline:2px solid var(--ink)}
.grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.frame{position:relative;padding:20px;min-width:0}
.frame::before,.frame::after,.frame>.c1,.frame>.c2{content:"";position:absolute;width:18px;height:18px;border:0 solid var(--ink);pointer-events:none}
.frame::before{top:0;left:0;border-top-width:2px;border-left-width:2px}
.frame::after{top:0;right:0;border-top-width:2px;border-right-width:2px}
.frame>.c1{bottom:0;left:0;border-bottom-width:2px;border-left-width:2px}
.frame>.c2{bottom:0;right:0;border-bottom-width:2px;border-right-width:2px}
h2{font:800 26px/1 var(--display);text-transform:uppercase;margin:0 0 6px;letter-spacing:.01em}
.hint{font-size:13.5px;color:var(--mute);margin:0 0 12px}
.knob{display:grid;gap:4px;padding:11px 0;border-top:1px solid var(--soft)}
.knob.first{border-top:0}
.knob .tag{color:var(--mute)}
.knob label{display:flex;justify-content:space-between;gap:10px;font-weight:600;font-size:14.5px}
.knob output{font:500 13px var(--mono);white-space:nowrap}
.knob small{color:var(--mute);font-size:12.5px;line-height:1.35}
.kind{font:500 10px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:0 5px;border:1px dashed var(--mute);color:var(--mute);justify-self:start}
.kind.fr{border-style:solid;border-color:var(--ink);color:var(--ink)}
.knob select{font:inherit;font-size:14px;padding:4px 6px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink)}
.hcard select{font:inherit;font-size:13px;padding:3px 4px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);justify-self:start}
input[type=range]{width:100%;accent-color:var(--ink)}
.btn{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:8px 12px;cursor:pointer}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:focus-visible,input:focus-visible,.lang button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:2px solid var(--ink)}
@media (max-width:560px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{display:grid;gap:2px;padding:12px 14px;border-left:1px solid var(--soft)}
.kpi:first-child{border-left:0;padding-left:0}
.kpi .v{font:800 46px/1 var(--display);font-variant-numeric:tabular-nums}
.kpi .k{font-size:13px;color:var(--mute)}
.chartbox{overflow-x:auto;margin-top:16px}
svg text{fill:var(--ink);font-family:var(--body)}
svg .axis{stroke:var(--soft)} svg .tick{fill:var(--mute);font-size:11px;font-family:var(--mono)}
.legend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--mute);margin-top:6px;align-items:center}
.legend svg{vertical-align:-2px;margin-right:6px}
.tablebox{overflow-x:auto;margin-top:6px}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:820px}
th,td{padding:7px 6px;border-bottom:1px solid var(--soft);text-align:right;white-space:nowrap;vertical-align:top}
thead th{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.03em;color:var(--mute);vertical-align:bottom;border-bottom:2px solid var(--ink)}
td:nth-child(-n+2),th:nth-child(-n+2){text-align:left}
td.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12.5px}
td .st{display:block;font:12px var(--body);color:var(--mute)}
tr.off td{color:var(--faint)}
.pill{display:inline-block;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border:1.5px solid var(--ink);margin-left:4px}
.pill.in{background:var(--ink);color:var(--paper)}
input.pct{width:58px;font:13px var(--mono);text-align:right;padding:3px 4px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink)}
input[type=checkbox]{accent-color:var(--ink);width:16px;height:16px}
textarea{width:100%;min-height:250px;font:12.5px/1.5 var(--mono);color:var(--ink);background:var(--paper);border:2px solid var(--ink);padding:10px}
footer.bottom{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:16px 32px;border-top:2px solid var(--rule);padding-top:16px}
footer .logos{display:flex;align-items:center;gap:26px}
footer .logos img{height:30px;width:auto}
footer .logos .ph{height:26px;width:auto;color:var(--ink)}
footer .logos a{color:var(--ink);display:inline-flex}
footer .credits{display:flex;flex-direction:column;gap:2px;text-align:right}
footer .credits .foot:empty{display:none}
@media (max-width:700px){footer .credits{text-align:left}}
.foot{font-size:12.5px;color:var(--mute);max-width:100ch;margin:0}
/* Unterrichtsablauf */
.seqbar{overflow-x:auto;margin:10px 0 4px}
.seqgrid{display:grid;grid-template-columns:repeat(6,minmax(118px,1fr));gap:6px;min-width:740px}
.seqset{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;background:var(--soft);text-align:center}
.seqset.s1{grid-column:1/5} .seqset.s2{grid-column:5/7}
.stepbtn{display:grid;gap:2px;text-align:left;border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:8px 10px;cursor:pointer;font:inherit}
.stepbtn .n{font:800 22px/1 var(--display);text-transform:uppercase}
.stepbtn .s{font-size:12px;color:var(--mute)}
.stepbtn[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.stepbtn[aria-selected="true"] .s{color:#cfcfcf}
.stepbtn.done .n::after{content:" ✓";font-size:16px}
.seqmeta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--ink);border-bottom:1px solid var(--soft);margin-top:14px}
@media (max-width:640px){.seqmeta{grid-template-columns:minmax(0,1fr)}}
.seqmeta div{padding:8px 12px 8px 0;display:grid;gap:2px}
.seqmeta .tag{color:var(--mute)} .seqmeta b{font-weight:600;font-size:14.5px}
.seqtask{font-size:15.5px;max-width:90ch;margin:14px 0 10px}
.seqtask ul{margin:6px 0 0;padding-left:20px}
.seqwork{display:grid;gap:12px;margin:8px 0 14px}
.claim{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;align-items:center;padding:8px 0;border-bottom:1px solid var(--soft)}
.claim .tx{flex:1 1 320px}
.seg{display:inline-flex;border:2px solid var(--ink)}
.seg button{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 9px;border:0;background:var(--paper);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.claim .fb{font:500 11px var(--mono);min-width:92px;text-align:right}
.funnel{display:grid;gap:6px}
.funnel .row{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr) 56px;gap:10px;align-items:center;font-size:13.5px}
@media (max-width:640px){.funnel .row{grid-template-columns:minmax(0,1fr) 56px}.funnel .bar{grid-column:1/-1;order:3}}
.funnel .bar{height:14px;background:var(--soft)} .funnel .bar i{display:block;height:100%;background:var(--ink)}
.funnel .num{font:500 13px var(--mono);text-align:right}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 16px;align-items:end}
.calc label{display:grid;gap:4px;font-size:13px;font-weight:600}
.calc input,.calc select,.seqwork select{font:13.5px var(--mono);padding:6px 8px;border:2px solid var(--ink);background:var(--paper);color:var(--ink);width:100%}
.out{border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);padding:10px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px}
.out .v{font:800 30px/1 var(--display)} .out .k{font-size:12.5px;color:var(--mute)}
.hcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.hcard{border:2px solid var(--ink);padding:10px 12px;display:grid;gap:4px;align-content:start}
.hcard .h{font:800 18px/1 var(--display);text-transform:uppercase}
.hcard .r{font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;justify-self:start;padding:1px 6px;border:1.5px solid var(--ink)}
.hcard .r.yes{background:var(--ink);color:var(--paper)}
.hcard p{margin:0;font-size:13.5px}
.weights{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 20px}
.weights label{display:flex;justify-content:space-between;font-size:13.5px;font-weight:600}
.weights output{font:500 12px var(--mono)}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices button{font:500 12px var(--body);border:2px solid var(--ink);background:var(--paper);color:var(--ink);padding:6px 10px;cursor:pointer}
.choices button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.seqwork textarea{min-height:90px;font:14px/1.45 var(--body)}
.seqwork h3{font:800 17px/1 var(--display);text-transform:uppercase;margin:6px 0 0}
.scenlist{font:12.5px/1.5 var(--mono);margin:0;padding-left:18px}
.seqnav{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.seqnav .sp{flex:1}
a.btn{text-decoration:none;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <img src="data:image/png;base64,/*__CL_LOGO__*/" alt="CreatorLab">
      <div>
        <div class="mono eyebrow" data-i="eyebrow"></div>
        <h1 data-i="title"></h1>
      </div>
    </div>
    <div class="lang" role="group" aria-label="Sprache / Language">
      <button type="button" id="lang-de" aria-pressed="true">DE</button>
      <button type="button" id="lang-en" aria-pressed="false">EN</button>
    </div>
  </header>

  <p class="lead" data-i="lead"></p>
  <div class="banner" id="banner"><span class="mono" id="banner-tag"></span><span id="banner-text"></span></div>

  <section class="frame" aria-labelledby="h-seq" id="seq"><i class="c1"></i><i class="c2"></i>
    <h2 id="h-seq" data-i="seqTitle"></h2>
    <p class="hint" data-i="seqHint"></p>
    <div class="seqbar"><div class="seqgrid">
      <div class="seqset s1" data-i="set1"></div><div class="seqset s2" data-i="set2"></div>
      <div id="stepbtns" role="tablist" style="display:contents"></div>
    </div></div>
    <div class="seqmeta">
      <div><span class="tag" data-i="metaSet"></span><b id="m-set"></b></div>
      <div><span class="tag" data-i="metaTA"></span><b id="m-ta"></b></div>
      <div><span class="tag" data-i="metaPS"></span><b id="m-ps"></b></div>
    </div>
    <div class="seqtask" id="s-task"></div>
    <div class="seqwork" id="s-work"></div>
    <div class="seqnav">
      <button class="btn" type="button" id="s-prev" data-i="prev"></button>
      <button class="btn" type="button" id="s-next" data-i="next"></button>
      <span class="sp"></span>
      <button class="btn" type="button" data-go="h-ann" data-i="toTool"></button>
      <button class="btn" type="button" data-go="h-prot" data-i="toProt"></button>
    </div>
  </section>

  <div class="grid">
    <section class="frame" aria-labelledby="h-ann"><i class="c1"></i><i class="c2"></i>
      <h2 id="h-ann" data-i="assumptions"></h2>
      <p class="hint" data-i="assumptionsHint"></p>

      <p class="hint" data-i="kindsHint"></p>
      <div class="knob first"><span class="tag" data-i="gWho"></span>
        <label for="crit"><span data-i="crit"></span> <output id="o-crit"></output></label>
        <select id="crit"><option value="0" data-i="critIV"></option><option value="1" data-i="critDD"></option></select>
        <small class="kind fr" data-i="kFrame"></small><small data-i="critHint"></small></div>
      <div class="knob" id="knob-thr">
        <label for="thr"><span data-i="thr"></span> <output id="o-thr"></output></label>
        <input type="range" id="thr" min="60" max="480" step="15">
        <small class="kind fr" data-i="kFrame"></small><small data-i="thrHint"></small></div>
      <div class="knob" id="knob-dm">
        <label for="dm"><span data-i="dm"></span> <output id="o-dm"></output></label>
        <input type="range" id="dm" min="0" max="180" step="15">
        <small class="kind fr" data-i="kFrame"></small><small data-i="dmHint"></small></div>
      <div class="knob">
        <label for="ms"><span data-i="ms"></span> <output id="o-ms"></output></label>
        <input type="range" id="ms" min="0.2" max="1" step="0.05">
        <small class="kind" data-i="kScen"></small><small data-i="msHint"></small></div>
      <div class="knob">
        <label for="acc"><span data-i="acc"></span> <output id="o-acc"></output></label>
        <select id="acc"><option value="0" data-i="acc0"></option><option value="1" data-i="acc1"></option><option value="2" data-i="acc2"></option></select>
        <small class="kind fr" data-i="kFrame"></small><small data-i="accHint"></small></div>
      <div class="knob">
        <label for="tr"><span data-i="tr"></span> <output id="o-tr"></output></label>
        <input type="range" id="tr" min="0" max="1" step="0.05">
        <small class="kind" data-i="kModel"></small><small data-i="trHint"></small></div>

      <div class="knob"><span class="tag" data-i="gAir"></span>
        <label for="lf"><span data-i="lf"></span> <output id="o-lf"></output></label>
        <input type="range" id="lf" min="0.5" max="0.95" step="0.05"><small class="kind" data-i="kModel"></small></div>
      <div class="knob">
        <label for="fe"><span data-i="fe"></span> <output id="o-fe"></output></label>
        <input type="range" id="fe" min="0.8" max="1.2" step="0.05"><small class="kind" data-i="kModel"></small></div>
      <div class="knob">
        <label for="nc"><span data-i="nc"></span> <output id="o-nc"></output></label>
        <input type="range" id="nc" min="1" max="3" step="0.1">
        <small class="kind fr" data-i="kFrame"></small><small data-i="ncHint"></small></div>

      <div class="knob"><span class="tag" data-i="gRail"></span>
        <label for="rg"><span data-i="rg"></span> <output id="o-rg"></output></label>
        <input type="range" id="rg" min="0" max="60" step="1">
        <small class="kind fr" data-i="kModelFrame"></small><small data-i="rgHint"></small></div>
      <div class="knob">
        <label for="rd"><span data-i="rd"></span> <output id="o-rd"></output></label>
        <input type="range" id="rd" min="1" max="1.6" step="0.05"><small class="kind" data-i="kModel"></small></div>

      <div class="knob"><span class="tag" data-i="gCity"></span>
        <label for="aa"><span data-i="aa"></span> <output id="o-aa"></output></label>
        <input type="range" id="aa" min="60" max="240" step="10">
        <small class="kind" data-i="kModel"></small><small data-i="aaHint"></small></div>
      <div class="knob">
        <label for="ra"><span data-i="ra"></span> <output id="o-ra"></output></label>
        <input type="range" id="ra" min="10" max="120" step="5"><small class="kind" data-i="kModel"></small></div>
      <div class="knob"><span class="tag" data-i="gTransfer"></span>
        <label for="aat"><span data-i="aa"></span> <output id="o-aat"></output></label>
        <input type="range" id="aat" min="60" max="240" step="10">
        <small class="kind" data-i="kModel"></small><small data-i="aatHint"></small></div>
      <div class="knob">
        <label for="rat"><span data-i="ra"></span> <output id="o-rat"></output></label>
        <input type="range" id="rat" min="30" max="200" step="5">
        <small class="kind" data-i="kModel"></small><small data-i="ratHint"></small></div>
      <button class="btn" id="reset" type="button" style="margin-top:10px" data-i="reset"></button>
    </section>

    <div style="display:grid;gap:22px;min-width:0">
      <section class="frame" aria-labelledby="h-erg"><i class="c1"></i><i class="c2"></i>
        <h2 id="h-erg" data-i="result"></h2>
        <p class="hint" id="period"></p>
        <div class="kpis">
          <div class="kpi"><span class="v" id="k-save">–</span><span class="k" id="k-save-l"></span></div>
          <div class="kpi"><span class="v" id="k-year">–</span><span class="k" data-i="kYear"></span></div>
          <div class="kpi"><span class="v" id="k-share">–</span><span class="k" data-i="kShare"></span></div>
        </div>
        <div class="chartbox" id="chartbox"></div>
        <div class="legend" id="legend"></div>
      </section>

      <section class="frame" aria-labelledby="h-tab"><i class="c1"></i><i class="c2"></i>
        <h2 id="h-tab" data-i="dest"></h2>
        <p class="hint" data-i="destHint"></p>
        <div class="tablebox"><table>
          <thead><tr><th data-i="thIn"></th><th data-i="thDest"></th><th data-i="thFlights"></th><th>km</th><th data-i="thRailHbf"></th><th data-i="thRailAp"></th><th data-i="thTransfer"></th><th data-i="thDoor"></th><th data-i="thCo2"></th></tr></thead>
          <tbody id="tbody"></tbody>
        </table></div>
        <p class="hint" id="nofl"></p>
      </section>

      <section class="frame" aria-labelledby="h-prot"><i class="c1"></i><i class="c2"></i>
        <h2 id="h-prot" data-i="protocol"></h2>
        <p class="hint" data-i="protocolHint"></p>
        <textarea id="proto" readonly aria-label="Protokoll / Protocol"></textarea>
        <div style="margin-top:8px"><button class="btn" id="copy" type="button" data-i="copy"></button> <span id="copied" class="hint"></span></div>
      </section>
    </div>
  </div>

  <p class="foot" data-i="method"></p>

  <footer class="bottom">
    <div class="logos">
      <img src="data:image/png;base64,/*__CL_LOGO__*/" alt="CreatorLab">
      <a href="https://www.ph-gmuend.de" target="_blank" rel="noopener" class="ph-link">/*__PH_LOGO__*/</a>
    </div>
    <div class="credits"><p class="foot" data-i="credit"></p>
    <p class="foot" data-i="ai"></p></div>
  </footer>
</div>

<script>
const DATA = /*__DATEN__*/null;
const $ = id => document.getElementById(id);
const IDS = ["crit","thr","dm","ms","acc","tr","lf","fe","nc","rg","rd","aa","ra","aat","rat"];
const TAXI_HALF = 7.5;  // half of the 15-min taxi time, as in the analysis
const excluded = new Set(), trOverride = new Map();
let LANG = "de";

const L = () => T[LANG];
const nf0 = () => new Intl.NumberFormat(LANG==="de"?"de-DE":"en-GB",{maximumFractionDigits:0});
const nf1 = () => new Intl.NumberFormat(LANG==="de"?"de-DE":"en-GB",{maximumFractionDigits:1,minimumFractionDigits:1});
const nm = n => LANG==="en" ? (NAMES_EN[n]||n) : n;
const hm = m => { m = Math.round(m); return `${Math.floor(m/60)}:${String(m%60).padStart(2,"0")} h`; };
const pct = v => Math.round(v*100)+" %";
const dec = (v,d=2) => (+v).toFixed(d).replace(".", LANG==="de"?",":".");
const FMT = {crit:v=>+v?L().critDDs:L().critIVs, dm:v=>"+ "+v+" min", acc:v=>[L().acc0s,L().acc1s,L().acc2s][+v], thr:hm, ms:pct, tr:pct, lf:pct, fe:v=>(v>=1?"+":"−")+Math.abs(Math.round((v-1)*100))+" %",
  nc:v=>"× "+dec(v,1), rg:v=>v+" g", rd:v=>"× "+dec(v), aa:v=>v+" min", ra:v=>v+" min", aat:v=>v+" min", rat:v=>v+" min"};

function setBasis(){ const b = {crit:0, dm:60, acc:0, ...DATA.basis}; IDS.forEach(i => { if (b[i] != null) $(i).value = b[i]; }); }
function params(){ const p={}; IDS.forEach(i=>p[i]=parseFloat($(i).value)); return p; }

function rechnen(){
  const p = params();
  const rows = DATA.rows.map(r => {
    const pax = r.seats * p.lf, co2Air = r.fuel * 3.16 * p.fe * p.nc;
    const airPP = co2Air / pax, railPP = r.km * p.rd * p.rg / 1000;
    const railHub = r.hub ? r.railHub : r.rail;  // Drehkreuz ohne Bahnzeit zum Flughafen: Umsteiger nicht verlagerbar
    const u = r.hub ? (trOverride.has(r.icao) ? trOverride.get(r.icao) : p.tr) : 0;
    const doorAir = r.dur + TAXI_HALF + p.aa, doorRail = r.rail==null ? null : r.rail + p.ra;
    const doorAirT = r.dur + TAXI_HALF + p.aat, doorRailT = railHub==null ? null : railHub + p.rat;
    // criterion: in-vehicle rail time <= threshold, or door-to-door rail <= door-to-door air + margin
    const cityOK = +p.crit ? (doorRail != null && doorRail <= doorAir + p.dm) : (r.rail != null && r.rail <= p.thr);
    const hubOK = r.hub && railHub != null && (+p.crit ? doorRailT <= doorAirT + p.dm : railHub <= p.thr);
    const share = (1-u)*(cityOK?1:0) + u*(hubOK?1:0);
    const inc = share > 0 && !excluded.has(r.icao);
    // accounting: 0 = average (pro rata), 1 = only whole flights cancelled (per route), 2 = no capacity response
    const shifted = inc ? share * p.ms : 0, railKg = shifted * pax * railPP;
    const save = !inc ? 0 : (+p.acc === 0 ? (shifted * co2Air - railKg) / 1000
      : +p.acc === 1 ? (Math.floor(shifted * r.n + 1e-9) * co2Air / r.n - railKg) / 1000 : -railKg / 1000);
    return {...r, pax, co2Air, airPP, railPP, railHub, u, cityOK, hubOK, share, inc, save,
      doorAir, doorRail, doorAirT, doorRailT};
  });
  const oth = DATA.other || {n:0, seats:0, dests:0};
  const totPax = rows.reduce((s,r)=>s+r.pax,0) + oth.seats * p.lf;
  const incPax = rows.filter(r=>r.inc).reduce((s,r)=>s+r.pax*r.share,0);
  return {p, rows, totPax, incPax, oth, save: rows.reduce((s,r)=>s+r.save,0), nFlights: rows.reduce((s,r)=>s+r.n,0) + oth.n};
}

  rail:(x,y,o)=>`<rect x="${x-5}" y="${y-5}" width="10" height="10" fill="${o?'#0a0a0a':'#9a9a9a'}"/>`,
  airT:(x,y,o)=>`<circle cx="${x}" cy="${y}" r="4.5" fill="#ffffff" stroke="${o?'#0a0a0a':'#9a9a9a'}" stroke-width="2"/>`,
  railT:(x,y,o)=>`<rect x="${x-4.5}" y="${y-4.5}" width="9" height="9" fill="#ffffff" stroke="${o?'#0a0a0a':'#9a9a9a'}" stroke-width="2"/>`
};
function chart(R){
  const W = 780, rowH = 30, top = 22, left = 120, right = 20, H = top + R.rows.length*rowH + 30;
  const vals = R.rows.flatMap(r => [r.doorAir, r.doorRail||0, r.hub ? r.doorAirT : 0, r.hub ? (r.doorRailT||0) : 0]);
  const xMax = Math.ceil(Math.max(...vals)/60), x = h => left + (W-left-right)*h/xMax;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px" role="img" aria-label="door-to-door" xmlns="http://www.w3.org/2000/svg">`;
  for (let h=0; h<=xMax; h++) s += `<line class="axis" x1="${x(h)}" x2="${x(h)}" y1="${top-8}" y2="${H-26}"/><text class="tick" x="${x(h)}" y="${H-10}" text-anchor="middle">${h} h</text>`;
  R.rows.forEach((r,i) => {
    const y0 = top + i*rowH + rowH/2, yc = r.hub ? y0-6 : y0, yt = y0+6;
    const oc = r.inc && r.cityOK, ot = r.inc && r.hubOK;
    s += `<text x="${left-10}" y="${y0+4}" text-anchor="end" font-size="13" font-weight="${r.inc?600:400}" ${r.inc?'':'fill="#5c5c5c"'}>${nm(r.name)}</text>`;
    if (r.doorRail!=null) s += `<line x1="${x(r.doorAir/60)}" x2="${x(r.doorRail/60)}" y1="${yc}" y2="${yc}" stroke="#d4d4d4" stroke-width="3"/>` + mk.rail(x(r.doorRail/60), yc, oc);
    s += mk.air(x(r.doorAir/60), yc, oc);
    if (r.hub && r.doorRailT!=null) s += `<line x1="${x(r.doorAirT/60)}" x2="${x(r.doorRailT/60)}" y1="${yt}" y2="${yt}" stroke="#d4d4d4" stroke-width="2" stroke-dasharray="4 3"/>` + mk.railT(x(r.doorRailT/60), yt, ot) + mk.airT(x(r.doorAirT/60), yt, ot);
  });
  return s + `</svg>`;
}
const icon = f => `<svg width="12" height="12" viewBox="0 0 12 12">${f(6,6,true)}</svg>`;

  $("banner").classList.toggle("demo", !!DATA.demo);

  $("banner-text").textContent = DATA.demo ? L().bannerDemo : L().bannerData(DATA.period, DATA.nFlights);

    .map(([f,k]) => `<span>${icon(f)}${L()[k]}</span>`).join("") + `<span>${L().lgBold}</span>`;
}

function zeichnen(){
  IDS.forEach(i => $("o-"+i).textContent = FMT[i]($(i).value));
  $("knob-thr").style.display = +$("crit").value ? "none" : ""; $("knob-dm").style.display = +$("crit").value ? "" : "none";
  const R = rechnen(), f0 = nf0(), f1 = nf1();
  $("period").textContent = L().period(DATA.period, DATA.days, f0.format(R.nFlights), f0.format(R.oth.n), R.oth.dests, R.rows.length);
  $("k-save").textContent = f0.format(R.save);
  $("k-save-l").textContent = L().kSave(DATA.days);
  $("k-year").textContent = f0.format(R.save * 365 / DATA.days);
  $("k-share").textContent = Math.round(100 * R.incPax / Math.max(R.totPax,1)) + " %";
  const nf = DATA.noFlight || [];
  $("nofl").textContent = nf.length ? L().nofl(nf.map(z => `${nm(z.name)} (${z.rail} min${z.privat ? ", " + L().privN(z.privat) : ""})`).join(", ")) : "";
  $("tbody").innerHTML = R.rows.map(r => `<tr class="${r.inc?"":"off"}">
    <td><input type="checkbox" data-icao="${r.icao}" aria-label="${nm(r.name)}" ${r.share>0?"":"disabled"} ${r.inc?"checked":""}></td>
    <td>${nm(r.name)}${r.hub?`<span class="pill">${L().hub}</span>`:""}${r.inc?`<span class="pill in">${L().shifted}</span>`:""}</td>

    if (!A.d3) A.d3 = (DATA.rows.find(r=>r.icao==="EDDB") || DATA.rows[0]).icao;
    h = destSel("d3") + `<div class="calc"><label>${S().kgph}<input type="number" min="0" step="50" data-f="kgph" value="${esc(A.kgph)}" placeholder="2500"><small class="hint" style="margin:0;font-weight:400">${S().kgphHint}</small></label>
      <label>${S().dur}<input id="c-dur" readonly></label><label>${S().seats}<input id="c-seats" readonly></label><label>${S().lfNow}<input id="c-lf" readonly></label></div>
      <div class="out"><div><span class="v" id="c-fuel">–</span><br><span class="k">${S().oFuel}</span></div><div><span class="v" id="c-own">–</span><br><span class="k">${S().oOwn}</span></div>
      <div><span class="v" id="c-tool">–</span><br><span class="k">${S().oTool}</span></div><div><span class="v" id="c-diff">–</span><br><span class="k">${S().oDiff}</span></div></div>` + ta("why", S().whyLabel, S().whyPh);
  } else if (i === 3) {
    if (!A.d4) A.d4 = (DATA.rows.find(r=>r.icao==="EDDM") || DATA.rows[0]).icao;
    h = destSel("d4") + `<div class="out" id="cmp"></div><ul class="hint" style="margin:0;padding-left:20px">${S().q4.map(q=>`<li>${esc(q)}</li>`).join("")}</ul>` + ta("fair", S().fairLabel, "");
  } else if (i === 4) {
    const H = DATA.hyp;
    if (H) { const SOL = ["s","e","m","m","s"], kn = x => ({e:S().kindE, m:S().kindM, s:S().kindS})[x];
      h = `<h3>${S().hyp}</h3><div class="hcards">${["h1","h2","h3","h4","h5"].map((k,j) => { const v = (A.kinds||{})[j];
        return `<div class="hcard"><span class="h">${esc(S().hNames[j])}</span><p>${esc(S()[k](H[k]))}</p>
        <label class="hint" style="margin:0">${S().kindQ} <select data-kind="${j}"><option value="">${S().kindPick}</option>${["e","m","s"].map(x=>`<option value="${x}" ${v===x?"selected":""}>${kn(x)}</option>`).join("")}</select></label>
        ${A.sol5 ? `<span class="r ${v===SOL[j]?"yes":""}">${S().kindSol}: ${kn(SOL[j])}</span><p class="hint" style="margin:0">${esc(S().kindWhy[j])}</p>` : ""}</div>`; }).join("")}</div>
        <div><button class="btn" type="button" data-act="sol5">${A.sol5?S().hideSol:S().showSol}</button></div>`; }
    h += `<h3>${S().scen}</h3><div class="seqnav"><button class="btn" type="button" data-act="keep">${S().keep}</button><button class="btn" type="button" data-act="clearScen">${S().clear}</button></div><div id="scen"></div>` + ta("range", S().rangeLabel, S().rangePh);
  } else {
    h = `<h3>${S().role}</h3><div class="choices">${S().roles.map((r,j)=>`<button type="button" data-role="${j}" aria-pressed="${A.role===j}">${esc(r)}</button>`).join("")}</div>
      <h3>${S().wTitle}</h3><div class="weights">${S().vdi.map((v,j)=>`<div><label for="w${j}">${esc(v)} <output id="ow${j}">${A.w[j] ?? 1}</output></label><input type="range" id="w${j}" data-w="${j}" min="0" max="3" step="1" value="${A.w[j] ?? 1}"></div>`).join("")}</div>
      <h3>${S().pos}</h3><div class="choices">${S().poss.map((r,j)=>`<button type="button" data-pos="${j}" aria-pressed="${A.pos===j}">${esc(r)}</button>`).join("")}</div>` + ta("brief", S().briefLabel, S().briefPh);
  }
  $("s-work").innerHTML = h;
  seqUpdate();
}
function seqUpdate(){
  if (!LASTR || !$("s-work")) return;
  const f0 = nf0(), f1 = nf1();
  if (A.step === 2 && $("c-dur")) {
    const r = rowBy(A.d3), seats = r.seats / r.n, lf = LASTR.p.lf;
    $("c-dur").value = Math.round(r.dur) + " min"; $("c-seats").value = f0.format(seats); $("c-lf").value = pct(lf);
    const k = parseFloat(A.kgph);
    $("c-tool").textContent = f0.format(r.airPP);
    if (k > 0) { const fuel = k * r.dur / 60, own = fuel * 3.16 / (seats * lf);
      $("c-fuel").textContent = f0.format(fuel); $("c-own").textContent = f0.format(own);
      $("c-diff").textContent = (own >= r.airPP ? "+" : "−") + Math.abs(Math.round(100*(own/r.airPP-1))) + " %"; }
    else ["c-fuel","c-own","c-diff"].forEach(id => $(id).textContent = "–");
  }
  if (A.step === 3 && $("cmp")) {
    const r = rowBy(A.d4), lim = ok => ok ? S().inLimit : S().outLimit;
    let c = `<div><span class="k">${S().cCity}</span><br><span class="v">${hm(r.doorAir)} / ${r.doorRail==null?"–":hm(r.doorRail)}</span><br><span class="k">${S().air} / ${S().rail} · ${lim(r.cityOK)}</span></div>`;
    if (r.hub) c += `<div><span class="k">${S().cHub}</span><br><span class="v">${hm(r.doorAirT)} / ${r.doorRailT==null?"–":hm(r.doorRailT)}</span><br><span class="k">${S().air} / ${S().rail} · ${lim(r.hubOK)}</span></div>`;
    c += `<div><span class="k">${S().cCo2}</span><br><span class="v">${f0.format(r.airPP)} / ${f1.format(r.railPP)} kg</span><br><span class="k">${S().air} / ${S().rail}</span></div>`;
    $("cmp").innerHTML = c;
  }
  if (A.step === 4 && $("scen")) {
    if (!A.scen.length) { $("scen").innerHTML = ""; }
    else { const v = A.scen.map(x=>x.save);
      $("scen").innerHTML = `<ol class="scenlist">${A.scen.map(x=>`<li>${f0.format(x.save)} t · ${esc(x.label)}</li>`).join("")}</ol><p class="hint" style="margin:6px 0 0;color:var(--ink);font-weight:600">${S().span(f0.format(Math.min(...v)), f0.format(Math.max(...v)))}</p>`; }
  }
}
const lab = i => L()[i] || ((i==="aat"||i==="rat") ? `${L()[i.slice(0,2)]} (${L().transferRow})` : i);
function changedLabel(){
  const p = params(), parts = IDS.filter(i => DATA.basis[i] != null && Math.abs(p[i] - DATA.basis[i]) > 1e-9).map(i => `${lab(i)} ${FMT[i](p[i])}`);
  if (excluded.size) parts.push("− " + [...excluded].map(k => nm(rowBy(k).name)).join(", "));
  return parts.join("; ") || S().base;
}
function stepsProto(){
  const s = S(), e = v => (v && String(v).trim()) || s.empty, f0 = nf0();
  const nClaims = Object.keys(A.claims).length, right = Object.entries(A.claims).filter(([j,v]) => s.claims[j] && s.claims[j][1] === v).length;
  let t = `${s.pHead}\n${s.pS1}: ${nClaims ? s.pClaims(right, s.claims.length) : s.empty}\n  ${s.pQ}: ${e(A.q)}\n${s.pS2}: ${s.pGaps}: ${e(A.gaps)}\n`;
  if (A.kgph && LASTR) { const r = rowBy(A.d3), seats = r.seats/r.n, own = parseFloat(A.kgph)*r.dur/60*3.16/(seats*LASTR.p.lf);
    t += `${s.pS3}: ${s.pCalc(nm(r.name), f0.format(own), f0.format(r.airPP))}\n  ${s.pWhy}: ${e(A.why)}\n`; }
  else t += `${s.pS3}: ${s.empty}\n`;
  t += `${s.pS4}: ${A.d4 ? s.pFair(nm(rowBy(A.d4).name)) : ""} ${e(A.fair)}\n`;
  const kk = A.kinds || {}, knm = x => ({e:s.kindE, m:s.kindM, s:s.kindS})[x] || s.empty;
  t += `${s.pS5}: ${s.pKinds}: ${[0,1,2,3,4].map(j => `${j+1} ${knm(kk[j])}`).join(", ")}\n  ${s.pScen}: ${A.scen.length ? A.scen.map(x=>`${f0.format(x.save)} t (${x.label})`).join(" | ") : s.empty}\n  ${s.pRange}: ${e(A.range)}\n`;
  t += `${s.pS6}: ${s.pRole}: ${A.role!=null ? s.roles[A.role] : s.empty}; ${s.pPos}: ${A.pos!=null ? s.poss[A.pos] : s.empty}\n  ${s.pW}: ${s.vdi.map((v,j)=>`${v} ${A.w[j] ?? 1}`).join(", ")}\n  ${s.pBrief}: ${e(A.brief)}`;
  return t;
}
function seqTexts(){ document.querySelectorAll("[data-i]").forEach(el => { const v = S()[el.dataset.i]; if (typeof v === "string") el.textContent = v; }); }
$("stepbtns").addEventListener("click", e => { const b = e.target.closest("[data-step]"); if (b){ A.step = +b.dataset.step; save(); renderStep(); } });
$("s-prev").addEventListener("click", () => { if (A.step > 0){ A.step--; save(); renderStep(); } });
$("s-next").addEventListener("click", () => { if (A.step < 5){ A.step++; save(); renderStep(); } });
$("s-work").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.claim != null){ A.claims[b.dataset.claim] = b.dataset.v; }
  else if (b.dataset.act === "sol"){ A.sol = !A.sol; }
  else if (b.dataset.act === "sol5"){ A.sol5 = !A.sol5; }
  else if (b.dataset.act === "keep" && LASTR){ A.scen.push({save: Math.round(LASTR.save), label: changedLabel()}); }
  else if (b.dataset.act === "clearScen"){ A.scen = []; }
  else if (b.dataset.role != null){ A.role = +b.dataset.role; }
  else if (b.dataset.pos != null){ A.pos = +b.dataset.pos; }
  else return;
  save(); renderStep(); writeProto();
});
$("s-work").addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f){ A[t.dataset.f] = t.value; }
  else if (t.dataset.w != null){ A.w[t.dataset.w] = +t.value; const o = $("ow"+t.dataset.w); if (o) o.textContent = t.value; }
  else return;
  save(); seqUpdate(); writeProto(); renderSteps();
});
document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { const t = $(b.dataset.go); if (t) t.scrollIntoView({behavior:"smooth", block:"start"}); }));
$("s-work").addEventListener("change", e => { const t = e.target;
  if (t.dataset.sel){ A[t.dataset.sel] = t.value; save(); seqUpdate(); writeProto(); }
  if (t.dataset.kind != null){ A.kinds = {...(A.kinds||{}), [t.dataset.kind]: t.value}; save(); renderStep(); writeProto(); } });
function setLang(l){ LANG = l; try { history.replaceState(null, "", l==="en" ? "#en" : location.pathname + location.search); } catch {} texte(); zeichnen(); renderStep(); }

function start(){
  if (!DATA){ document.querySelector(".wrap").insertAdjacentHTML("afterbegin","<p>No data. Run werkzeug_bauen.py.</p>"); return; }
  setBasis(); texte(); zeichnen(); renderStep();
}
document.addEventListener("change", e => { if (e.target.tagName === "SELECT" && IDS.includes(e.target.id)) zeichnen(); });
document.addEventListener("input", e => { if (IDS.includes(e.target.id)) { if (e.target.id === "tr") trOverride.clear(); zeichnen(); } });
$("tbody").addEventListener("change", e => {
  const c = e.target.dataset.icao, t = e.target.dataset.tr;
  if (c){ e.target.checked ? excluded.delete(c) : excluded.add(c); zeichnen(); }
  if (t){ const v = Math.min(100, Math.max(0, parseFloat(e.target.value)||0)); trOverride.set(t, v/100); zeichnen(); }
});
$("reset").addEventListener("click", () => { setBasis(); excluded.clear(); trOverride.clear(); zeichnen(); });
$("lang-de").addEventListener("click", () => setLang("de"));
$("lang-en").addEventListener("click", () => setLang("en"));
window.addEventListener("hashchange", () => { const l = location.hash === "#en" ? "en" : "de"; if (l !== LANG) setLang(l); });
$("copy").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText($("proto").value); $("copied").textContent = L().copied; }
  catch { $("proto").select(); $("copied").textContent = L().copyFail; }
});
start();
</script>
